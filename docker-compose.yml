services:
  train:
    build: .
    container_name: lerobot-train
    env_file: .env
    volumes:
      - ./:/work
      - ~/.cache/huggingface:/root/.cache/huggingface
    shm_size: "16gb"
    tty: true
    stdin_open: true
    command: bash
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]